description: 'National Stock Exchange of India (NSE), operating at nseindia.com, is
  one of the world''s largest stock exchanges by number of trades and derivatives
  contracts, headquartered in Mumbai. It runs electronic equity, derivatives, debt,
  and currency markets, publishes market data and corporate filings, and maintains
  the Nifty family of indices via NSE Indices. NSE exposes market data primarily
  through licensed data feeds and the undocumented endpoints powering nseindia.com
  rather than a published public developer API program; this profile was surfaced
  as an enrichment lead and has no documented public REST API surface at this time.'
